# The relay socket directory (docs/SWITCHBOARD.md, "Outbound agents"). Install as
# /etc/tmpfiles.d/switchboard-relay.conf and run `systemd-tmpfiles --create` on it.
# Owner: the hub's user (vcm on a server, switchboard on the WSL layout); group: the relay account.
# The setgid bit gives the socket the hub creates the group sbrelay; nobody else can enter.
d /run/switchboard-relay 2750 vcm sbrelay -
