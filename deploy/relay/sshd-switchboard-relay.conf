# sshd drop-in for the Switchboard relay account (docs/SWITCHBOARD.md, "Outbound agents").
# Install as /etc/ssh/sshd_config.d/switchboard-relay.conf, then `sshd -t` and check with
#   sshd -T -C user=sbrelay,host=x,addr=192.0.2.1
# that it shows disableforwarding yes, permittty no and the key file below. A global AllowUsers or
# AllowGroups list needs sbrelay added. No ForceCommand: it would override the per-key command=
# that names the machine.

Match User sbrelay
    AuthorizedKeysFile /etc/ssh/switchboard-relay/authorized_keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 1
    ClientAliveInterval 15
    ClientAliveCountMax 3
